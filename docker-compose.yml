services:
  bot:
    build: .
    image: github-discord-issues-sync:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      PORT: "5000"
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    volumes:
      - bot-data:/app/data
    stop_grace_period: 35s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
